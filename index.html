<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>د. مروى ثابت · أخصائية تغذية علاجية</title>
<meta name="description" content="د. مروى ثابت، أخصائية تغذية علاجية. استشارات تغذية عن بُعد وخطط وجبات من المطبخ اليمني. العافية تشتي أكل.">
<meta property="og:title" content="د. مروى ثابت · أخصائية تغذية علاجية">
<meta property="og:description" content="العافية تشتي أكل. استشارات تغذية عن بُعد وخطط من أكلنا اليمني.">
<meta property="og:image" content="img/og.jpg">
<meta name="theme-color" content="#1F5A3A">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Markazi+Text:wght@400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700&family=Gloock&display=swap">
<style>
/* Layout: an open editorial page. Calligraphic hero over Yemeni highland terraces; serif headings; hairline rules instead of boxes; Sana'a cues (qamariya arch, gypsum frieze) used sparingly. Light theme by design. */
:root{
  color-scheme:light;
  --bg:#F2F1EB;        /* gypsum paper */
  --paper:#F7F6F1;
  --white:#FFFFFF;
  --ink:#1D2A21;       /* green-black for headings */
  --text:#34403A;
  --muted:#6C7770;
  --line:#D8DACF;
  --forest:#1F5A3A;    /* primary */
  --forest-deep:#153F29;
  --leaf:#6A9A35;
  --coffee:#6B4429;    /* Yemeni coffee / mud brick */
  --saffron:#C98A1A;   /* hawaij, qamariya glass */
  --mint:#E3EBDD;
  --amber:#B57911; --amber-soft:#F4E8CF;
  --tomato:#B9472F; --tomato-soft:#F3E0D9;
  --f-callig:"Aref Ruqaa","Markazi Text",serif;
  --f-serif:"Markazi Text","Aref Ruqaa",Georgia,serif;
  --f-latin-display:"Gloock","Markazi Text",Georgia,serif;
  --f-body:"Vazirmatn","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:4px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15.5px;line-height:1.8;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-serif);color:var(--ink);margin:0;font-weight:600;line-height:1.15;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--forest);outline-offset:3px}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
[lang="en"] h1,[lang="en"] h2,[lang="en"] h3{font-family:var(--f-latin-display);font-weight:400;letter-spacing:-.01em}

/* buttons: squared, quiet */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid transparent;border-radius:var(--r);padding:13px 22px;font-weight:500;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s}
.btn-dark{background:var(--forest);color:#fff}
.btn-dark:hover{background:var(--forest-deep)}
.btn-white{background:#fff;color:var(--ink)}
.btn-white:hover{background:var(--mint)}
.btn-line{border-color:var(--ink);background:transparent;color:var(--ink)}
.btn-line:hover{background:var(--ink);color:#fff}
.btn-sm{padding:8px 15px;font-size:14px}
.btn svg{width:18px;height:18px;flex:none}
.link{display:inline-flex;align-items:center;gap:8px;font-weight:500;color:var(--forest);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px;background:none;border-top:0;border-inline:0;cursor:pointer}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* prototype switcher */
.demo{background:var(--ink);color:#C9D6CC;font-size:12.5px}
.demo .wrap{display:flex;align-items:center;justify-content:center;gap:12px;padding-block:6px;flex-wrap:wrap}
.seg{display:flex;gap:2px}
.seg button{border:0;background:none;color:inherit;padding:3px 12px;border-radius:3px;cursor:pointer;font-size:12.5px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600}

/* brand: qamariya mark + name */
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);min-width:0}
.brand .qm{width:30px;height:36px;flex:none}
.brand b{display:block;font-family:var(--f-serif);font-weight:700;font-size:21px;line-height:1.05;white-space:nowrap}
[lang="en"] .brand b{font-family:var(--f-latin-display);font-weight:400;font-size:19px}
.brand small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;white-space:nowrap}
.lang{border:0;background:none;padding:6px 8px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink);border-bottom:1px solid transparent}
.lang:hover{border-color:var(--ink)}

/* gypsum frieze (Sana'a window trim) */
.frieze{height:14px;background-color:var(--coffee);background-image:conic-gradient(from 135deg at 50% 0,#F7F6F1 90deg,transparent 0);background-size:14px 7px;background-repeat:repeat-x;background-position:0 0}
.frieze.b{background-image:conic-gradient(from -45deg at 50% 100%,#F7F6F1 90deg,transparent 0);background-position:0 100%}

/* ---------- HERO ---------- */
.hero{background:var(--paper);position:relative;overflow:hidden}
.hnav{display:flex;align-items:center;gap:30px;padding-block:20px}
.hnav nav{display:flex;gap:26px;font-size:14.5px}
.hnav nav button{border:0;background:none;cursor:pointer;color:var(--text);padding:4px 0;border-bottom:1px solid transparent}
.hnav nav button:hover{border-color:var(--ink);color:var(--ink)}
.hnav .end{margin-inline-start:auto;display:flex;gap:14px;align-items:center}
@media (max-width:960px){.hnav nav{display:none}}
@media (max-width:440px){.hnav .login span{display:none}.hnav .login{padding:9px 11px}.brand small{display:none}}

.stage{position:relative;height:clamp(440px,47vw,600px);max-width:1320px;margin-inline:auto;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.word{position:absolute;font-family:var(--f-callig);font-weight:700;color:var(--ink);line-height:1.15;font-size:clamp(70px,12.6vw,184px);white-space:nowrap;margin:0;z-index:1}
[lang="en"] .word{font-family:var(--f-latin-display);font-weight:400;letter-spacing:-.035em;line-height:.95;font-size:clamp(56px,9.6vw,140px)}
.lead-block{position:absolute;top:-2%;inset-inline-start:max(16px,env(safe-area-inset-left,0px));z-index:1}
[lang="en"] .lead-block{top:4%}
.lead-block .word{position:static}
.tagline{margin-top:-4px;display:flex;align-items:center;gap:12px;font-size:15px;color:var(--ink)}
[lang="en"] .tagline{margin-top:14px}
.tagline .dot{width:7px;height:7px;background:var(--saffron);transform:rotate(45deg);flex:none}
.tagline i{display:block;width:clamp(50px,10vw,150px);height:1px;background:var(--ink);opacity:.3}
.word.w2{bottom:21%;inset-inline-end:max(16px,env(safe-area-inset-right,0px));z-index:3}
[dir="ltr"] .word.w2{bottom:27%}
.produce{position:absolute;z-index:2;height:auto;pointer-events:none;filter:drop-shadow(0 22px 24px rgb(29 42 33 / .16))}
[dir="rtl"] .produce{left:27%;width:min(63%,820px);top:4%;transform:scaleX(-1)}
[dir="ltr"] .produce{width:min(46%,610px);left:4%;top:36%}
.ring{position:absolute;top:2%;inset-inline-end:max(16px,env(safe-area-inset-right,0px));z-index:3;display:flex;align-items:center;gap:12px;font-size:13px;line-height:1.4;color:var(--ink)}
.ring .ic{width:46px;height:46px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;color:var(--forest)}

.hill{position:relative;margin-top:calc(clamp(440px,47vw,600px) * -0.12);z-index:4}
.props{display:block;width:min(94%,1240px);height:auto;margin-inline:auto;position:relative;z-index:2;margin-bottom:-1.4%;filter:drop-shadow(0 16px 12px rgb(10 30 18 / .22))}
.desk{position:relative;background:linear-gradient(180deg,#2B6E49 0 12px,#174A2F 12px 14px,var(--forest) 14px);padding-top:clamp(26px,3.6vw,46px);display:flex;align-items:flex-end}

.hill-in{position:relative;width:100%;max-width:1320px;margin-inline:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-inline:max(16px,env(safe-area-inset-left,0px));direction:ltr}
.hill-copy{max-width:420px;padding-bottom:clamp(28px,4vw,48px);color:#fff;display:grid;gap:18px;justify-items:start}
[dir="rtl"] .hill-copy,[dir="rtl"] .hero-cards{direction:rtl}
.hill-copy p{text-wrap:pretty;font-family:var(--f-serif);font-weight:500;font-size:clamp(21px,2.1vw,27px);line-height:1.35;}
[lang="en"] .hill-copy p{font-family:var(--f-body);font-weight:400;font-size:clamp(18px,1.7vw,21px);line-height:1.5}
.hero-cards{display:flex;gap:0;align-items:stretch;background:var(--paper)}
.hcard{width:clamp(180px,17vw,230px);padding:22px 22px 24px;text-decoration:none;color:var(--ink);display:grid;gap:26px;cursor:pointer;border:0;text-align:start;font:inherit;background:var(--paper);border-top:3px solid var(--forest)}
.hcard+.hcard{border-inline-start:1px solid var(--line);border-top-color:var(--saffron)}
.hcard:hover{background:#fff}
.hcard h3{font-size:22px;line-height:1.25}
[lang="en"] .hcard h3{font-size:20px}
.hcard>span{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.hcard>span svg{width:20px;height:20px;color:var(--ink)}
@media (max-width:820px){
  .stage{height:auto;display:flex;flex-direction:column;padding-bottom:0}
  .word,.lead-block,.produce,.ring{position:static}
  .ring{display:none}
  [dir] .produce{width:112%;max-width:none;margin-inline:-6%;margin-top:6px;order:3;left:auto;top:auto}
  .word.w2{order:4;margin-top:-4%;align-self:flex-end;position:relative;z-index:5}
  .hill{margin-top:-10px}
  .props{width:104%;margin-inline:-2%}

  .hill-in{flex-direction:column-reverse;align-items:stretch;gap:26px}
  .hill-copy{max-width:none;padding-bottom:0}
  .hero-cards{display:grid;grid-template-columns:1fr 1fr}
  .hcard{width:auto;padding:16px 16px 18px;gap:18px}
  .hcard h3{font-size:19px}
}

/* ---------- sections ---------- */
section.sec{padding-block:clamp(64px,9vw,112px)}
.label{display:inline-flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--coffee);margin-bottom:16px}
.label::before{content:"";width:7px;height:7px;background:var(--saffron);transform:rotate(45deg)}
[lang="en"] .label{text-transform:uppercase;letter-spacing:.1em;font-size:12px}
.h2{font-size:clamp(36px,4.8vw,60px);max-width:16ch}
[lang="en"] .h2{font-size:clamp(32px,4.2vw,52px)}
.sub{font-size:17px;color:var(--muted);max-width:54ch;margin-top:16px}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:52px}

/* conditions marquee */
.conds{display:flex;align-items:center;gap:22px;padding-block:18px;background:var(--white);border-bottom:1px solid var(--line)}
.conds .lead{flex:none;color:var(--muted);font-size:13.5px;padding-inline-start:max(16px,env(safe-area-inset-left,0px))}
.marq{flex:1;min-width:0;overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.marq-track{display:flex;width:max-content;animation:marq 46s linear infinite}
[dir="rtl"] .marq-track{animation-name:marq-r}
.marq:hover .marq-track{animation-play-state:paused}
.conds b{font-family:var(--f-serif);font-weight:500;font-size:20px;color:var(--ink);display:flex;align-items:center;gap:20px;padding-inline-end:20px;white-space:nowrap}
[lang="en"] .conds b{font-family:var(--f-body);font-size:15px}
.conds b::after{content:"";width:6px;height:6px;background:var(--leaf);transform:rotate(45deg)}
@keyframes marq{to{transform:translateX(-50%)}}
@keyframes marq-r{to{transform:translateX(50%)}}
@media (prefers-reduced-motion: reduce){.marq-track{animation:none}}

/* plate in a qamariya arch */
.plate-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(30px,6vw,84px);align-items:center}
.arch{position:relative;border-radius:999px 999px var(--r) var(--r);background:var(--white);border:1px solid var(--line);aspect-ratio:5/6;max-width:500px;width:100%;margin-inline:auto;display:grid;place-items:center;direction:ltr}
.arch::before{content:"";position:absolute;inset:12px;border-radius:999px 999px 2px 2px;border:1px solid var(--line)}
.arch img{width:84%;height:auto;position:relative;filter:drop-shadow(0 18px 22px rgb(29 42 33 / .16));margin-top:10%}
.call{position:absolute;background:var(--ink);color:#fff;border-radius:3px;padding:5px 11px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px;white-space:nowrap;z-index:2}
.call i{font-style:normal;font-family:var(--f-serif);font-weight:700;font-size:17px;color:#F2C66B;line-height:1}
.call.veg{left:2%;top:46%}
.call.pro{left:54%;top:20%}
.call.gr{right:4%;bottom:12%}
.call.hl{right:-4%;top:52%}
.portions{margin-top:34px;border-top:1px solid var(--ink)}
.portion{display:grid;grid-template-columns:78px 1fr;gap:18px;padding-block:20px;border-bottom:1px solid var(--line);align-items:baseline}
.portion b{font-family:var(--f-serif);font-size:44px;font-weight:600;color:var(--forest);line-height:.8}
.portion h3{font-size:24px;margin-bottom:2px}
[lang="en"] .portion h3{font-size:20px}
.portion p{color:var(--muted);font-size:15px}
@media (max-width:820px){.plate-grid{grid-template-columns:1fr}.call{font-size:11.5px;padding:4px 8px}.call.hl{right:0}}

/* about */
.about{background:var(--white);border-block:1px solid var(--line)}
.about-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:clamp(30px,6vw,84px);align-items:center}
.cred{border-radius:999px 999px var(--r) var(--r)/180px 180px var(--r) var(--r);background:var(--mint);padding:44px clamp(22px,3vw,36px) 30px;display:grid;justify-items:center;gap:14px;max-width:440px;width:100%;margin-inline:auto}
.cred .qm{width:58px;height:70px}
.cred h3{font-size:28px}
[lang="en"] .cred h3{font-size:24px}
.cred dl{margin:0;width:100%;border-top:1px solid rgb(29 42 33 / .25)}
.cred dl div{padding-block:13px;border-bottom:1px solid rgb(29 42 33 / .12)}
.cred dt{font-size:12.5px;color:var(--coffee);font-weight:600}
.cred dd{margin:2px 0 0;font-family:var(--f-serif);font-size:21px;line-height:1.35;color:var(--ink);font-weight:500}
[lang="en"] .cred dd{font-family:var(--f-body);font-size:15.5px}
.about blockquote{margin:0;font-family:var(--f-serif);font-size:clamp(25px,2.6vw,33px);line-height:1.45;color:var(--ink)}
[lang="en"] .about blockquote{font-family:var(--f-latin-display);font-size:clamp(22px,2.2vw,28px);line-height:1.4}
.sig{margin-top:24px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.sig b{font-family:var(--f-callig);font-size:34px;color:var(--forest);font-weight:700}
[lang="en"] .sig b{font-family:var(--f-latin-display);font-weight:400;font-size:26px}
.pillars{list-style:none;padding:0;margin:34px 0 0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.pillars li{padding:18px 18px 0 0;font-size:14.5px}
[dir="rtl"] .pillars li{padding:18px 0 0 18px}
.pillars li+li{border-inline-start:1px solid var(--line);padding-inline-start:18px}
.pillars b{display:block;font-family:var(--f-serif);font-size:20px;color:var(--ink);font-weight:600;margin-bottom:4px}
[lang="en"] .pillars b{font-family:var(--f-body);font-size:15.5px}
.pillars span{color:var(--muted)}
@media (max-width:820px){.about-grid{grid-template-columns:1fr}.pillars{grid-template-columns:1fr}.pillars li{border:0!important;padding-inline:0!important;border-bottom:1px solid var(--line)!important;padding-bottom:14px}}

/* calculator */
.calc-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,5vw,64px);align-items:start}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-size:13.5px;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{border:0;border-bottom:1.5px solid var(--line);background:transparent;border-radius:0;padding:8px 2px 10px;width:100%;font-size:18px;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--forest);outline:none}
.field textarea{min-height:96px;resize:vertical;font-size:16px}
.field.full{grid-column:1/-1}
.toggle2{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.toggle2 button{flex:1;border:0;background:transparent;padding:10px 8px;cursor:pointer;font-size:15px;color:var(--text)}
.toggle2 button+button{border-inline-start:1px solid var(--line)}
.toggle2 button[aria-pressed="true"]{background:var(--ink);color:#fff}
.result{background:var(--forest);color:#fff;border-radius:999px 999px var(--r) var(--r)/260px 260px var(--r) var(--r);padding:84px 32px 32px;display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden}
.result .rays{position:absolute;top:0;left:50%;transform:translateX(-50%);width:200px;height:100px;opacity:.9}
.result .lab{font-size:13.5px;color:#BCD3C2}
.result .big{font-family:var(--f-serif);font-size:76px;font-weight:600;line-height:.9}
[lang="en"] .result .big{font-family:var(--f-latin-display);font-weight:400;font-size:68px}
.result .big small{font-family:var(--f-body);font-size:16px;font-weight:400;margin-inline-start:8px;color:#BCD3C2}
.result .pair{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgb(255 255 255 / .2)}
.result .pair div{padding:12px 0}
.result .pair div+div{border-inline-start:1px solid rgb(255 255 255 / .2);padding-inline-start:16px}
.result .pair b{font-size:20px;font-weight:500}
.macro{display:flex;height:6px;gap:3px;margin-top:10px}
.mleg{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;margin-top:10px}
.mleg span{display:flex;align-items:center;gap:7px}
.mleg i{width:8px;height:8px;transform:rotate(45deg)}
.note{font-size:12.5px;color:var(--muted);margin-top:14px}
@media (max-width:820px){.calc-grid{grid-template-columns:1fr}}
@media (max-width:420px){.form-grid{grid-template-columns:1fr}}

/* how */
.how{background:var(--paper);border-top:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));list-style:none;padding:0;margin:0;border-top:1px solid var(--ink)}
.steps li{padding-top:22px;padding-inline-end:24px}
.steps li+li{border-inline-start:1px solid var(--line);padding-inline-start:24px}
.steps .n{font-family:var(--f-serif);font-size:44px;color:var(--saffron);font-weight:600;display:block;line-height:1;margin-bottom:22px}
.steps h3{font-size:24px;margin-bottom:6px}
[lang="en"] .steps h3{font-size:20px}
.steps p{color:var(--muted);font-size:15px}
@media (max-width:820px){.steps{grid-template-columns:1fr 1fr;row-gap:34px}.steps li{border:0!important;padding-inline:0!important}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}

/* consultation types: open columns, not boxes */
.types{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,56px)}
.type{display:flex;flex-direction:column;gap:16px;border-top:3px solid var(--forest);padding-top:22px}
.type.off{border-top:3px dashed #B9BDB2}
.type .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.type h3{font-size:34px}
[lang="en"] .type h3{font-size:30px}
.type.off h3{color:var(--muted)}
.type>p{color:var(--muted)}
.type ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.type li{padding-block:10px;border-bottom:1px solid var(--line);font-size:15px;display:flex;justify-content:space-between;gap:12px}

@media (max-width:1000px){.flabs{grid-template-columns:1fr}.ftiles{grid-template-columns:repeat(2,minmax(0,1fr))}.ftile:not(:nth-child(3n+1)){border-inline-start:0}.ftile:nth-child(2n){border-inline-start:1px solid rgb(255 255 255 / .15)}}

}
/* ---------- motion ---------- */
section.sec{position:relative;overflow-x:clip}
.floaty{position:absolute;pointer-events:none;z-index:2;width:var(--w,48px);will-change:translate;filter:drop-shadow(0 12px 12px rgb(29 42 33 / .18))}
.floaty img{display:block;width:100%;height:auto;animation:bob var(--d,7s) ease-in-out var(--dl,0s) infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r0,-6deg))}50%{transform:translateY(-16px) rotate(var(--r1,9deg))}}
@media (max-width:820px){.floaty.dm{display:none}}
@keyframes rise{from{opacity:0;translate:0 36px}}
@keyframes dropIn{from{opacity:0;translate:0 -46px;scale:.92}}
@keyframes sway{0%,100%{rotate:-1.2deg}50%{rotate:1.4deg}}
@keyframes hillIn{from{translate:0 70px}}
.hero .lead-block{animation:rise .9s cubic-bezier(.2,.7,.2,1) .1s backwards}
.hero .tagline{animation:rise .9s cubic-bezier(.2,.7,.2,1) .35s backwards}
.hero .word.w2{animation:rise .9s cubic-bezier(.2,.7,.2,1) .55s backwards}
.hero .produce{animation:dropIn 1.2s cubic-bezier(.2,.8,.2,1) .2s backwards,sway 9s ease-in-out 1.4s infinite}
.hero .ring{animation:rise .8s ease .7s backwards}
.hero .hill{animation:hillIn 1.2s cubic-bezier(.2,.7,.2,1) .15s backwards}
.hero .hill-copy{animation:rise .9s cubic-bezier(.2,.7,.2,1) .8s backwards}
.hero .hcard{animation:rise .8s cubic-bezier(.2,.7,.2,1) backwards;transition:translate .25s,background .2s}
.hero .hcard:nth-child(1){animation-delay:.95s}.hero .hcard:nth-child(2){animation-delay:1.05s}
.hcard:hover{translate:0 -8px}
.hcard>span svg{transition:translate .25s}
.hcard:hover>span svg{translate:-6px 0}
[dir="ltr"] .hcard:hover>span svg{translate:6px 0}
.btn svg{transition:translate .2s}
.btn:hover svg{translate:0 -2px}
/* qamariya glint on brand hover */
.brand .qm path{transform-box:fill-box}
.brand:hover .qm path{animation:glint .9s ease both}
.brand:hover .qm path:nth-of-type(2){animation-delay:0s}.brand:hover .qm path:nth-of-type(3){animation-delay:.07s}.brand:hover .qm path:nth-of-type(4){animation-delay:.14s}.brand:hover .qm path:nth-of-type(5){animation-delay:.21s}.brand:hover .qm path:nth-of-type(6){animation-delay:.28s}.brand:hover .qm path:nth-of-type(7){animation-delay:.35s}.brand:hover .qm path:nth-of-type(8){animation-delay:.42s}
.brand:hover .qm path:first-child{animation:none}
@keyframes glint{0%,100%{opacity:1}45%{opacity:.25}}
/* plate: scroll-linked spin, callouts pop, rows point at the plate */
.arch img{will-change:rotate}
.call{transition:scale .45s cubic-bezier(.3,1.6,.5,1),opacity .3s,background .2s;scale:.82}
.arch.in .call{scale:1}
.arch.in .call:nth-of-type(2){transition-delay:.08s}.arch.in .call:nth-of-type(3){transition-delay:.16s}.arch.in .call:nth-of-type(4){transition-delay:.24s}
.arch.dim .call:not(.hot){opacity:.3}
.call.hot{background:var(--saffron);scale:1.14}
.call.hot i{color:#fff}
.portion{transition:background .2s,padding .2s;cursor:default;border-radius:2px}
.portion:hover,.portion:focus-visible{background:var(--mint);padding-inline:12px}
.portion b{transition:scale .3s}
.portion:hover b{scale:1.15}
/* steps: progress line drawn by scroll */
.steps{position:relative}
.steps::after{content:"";position:absolute;top:-2px;inset-inline-start:0;width:100%;height:3px;background:var(--saffron);transform:scaleX(var(--p,0));transform-origin:right}
[dir="ltr"] .steps::after{transform-origin:left}
.steps .n{transition:scale .5s cubic-bezier(.3,1.6,.5,1),color .3s;display:inline-block}
.steps li.lit .n{color:var(--forest);scale:1.12}
/* reveal on scroll (only for content below the first screen) */
[data-rv]{transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0) * 90ms)}
[data-rv]:not(.in){opacity:.2;transform:translateY(30px)}
/* app mock: water fills on a loop */
.mock .cups i{animation:cup 7s ease-in-out infinite}
.mock .cups i:nth-child(1){animation-delay:0s}.mock .cups i:nth-child(2){animation-delay:.35s}.mock .cups i:nth-child(3){animation-delay:.7s}.mock .cups i:nth-child(4){animation-delay:1.05s}.mock .cups i:nth-child(5){animation-delay:1.4s}.mock .cups i:nth-child(6){animation-delay:1.75s}.mock .cups i:nth-child(7){animation-delay:2.1s}.mock .cups i:nth-child(8){animation-delay:2.45s}
@keyframes cup{0%,8%{background:var(--mint)}16%,82%{background:var(--leaf)}92%,100%{background:var(--mint)}}
.mock{animation:mockfloat 6s ease-in-out infinite}
@keyframes mockfloat{0%,100%{translate:0 0;rotate:-1.5deg}50%{translate:0 -12px;rotate:1deg}}
.type,.story,.tpl{transition:translate .25s}
.type:hover,.story:hover{translate:0 -4px}
@media (prefers-reduced-motion: reduce){
  .floaty img,.hero *,.hero .produce,.mock,.mock .cups i,.brand .qm path{animation:none!important}
  [data-rv]{opacity:1!important;transform:none!important}
  .call{scale:1}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

/* qamariya (Sana'a arched stained-glass window) mark, generated */
function qamariya(){
  const cx=20,cy=21,r=15,cols=['#C98A1A','#F7F6F1','#6A9A35','#F7F6F1','#B9472F','#F7F6F1','#C98A1A'];
  let s=`<path d="M2 47V21a18 18 0 0 1 36 0v26z" fill="#1F5A3A"/>`;
  const n=cols.length;
  for(let i=0;i<n;i++){const a0=Math.PI+i*Math.PI/n,a1=Math.PI+(i+1)*Math.PI/n;
    s+=`<path d="M${cx} ${cy}L${(cx+r*Math.cos(a0)).toFixed(2)} ${(cy+r*Math.sin(a0)).toFixed(2)}A${r} ${r} 0 0 1 ${(cx+r*Math.cos(a1)).toFixed(2)} ${(cy+r*Math.sin(a1)).toFixed(2)}Z" fill="${cols[i]}" stroke="#1F5A3A" stroke-width="1.1"/>`}
  s+=`<circle cx="${cx}" cy="${cy}" r="3.2" fill="#1F5A3A"/><rect x="5" y="24" width="30" height="20" fill="#F7F6F1"/><path d="M20 24v20M5 34h30" stroke="#1F5A3A" stroke-width="1.6"/>`;
  return s;
}
function rays(){ // fan used on the calculator arch
  let s='<svg class="rays" viewBox="0 0 200 100" aria-hidden="true">';const n=9;
  for(let i=0;i<n;i++){const a0=Math.PI+i*Math.PI/n,a1=Math.PI+(i+1)*Math.PI/n;
    s+=`<path d="M100 100L${100+90*Math.cos(a0)} ${100+90*Math.sin(a0)}A90 90 0 0 1 ${100+90*Math.cos(a1)} ${100+90*Math.sin(a1)}Z" fill="${['#2A6B47','#245F3F','#C98A1A'][i%3==1?2:i%2]}" opacity="${i%3==1?.55:.9}" stroke="#1F5A3A" stroke-width="2"/>`}
  return s+'<circle cx="100" cy="100" r="12" fill="#1F5A3A"/></svg>';
}

/* ---------- chart ---------- */
function lineChart(ys,o={}){
  const W=o.w||420,H=o.h||210,p={l:32,r:40,t:18,b:26};
  const vals=ys.concat(o.goal?[o.goal]:[]);let mn=Math.floor(Math.min(...vals)-1),mx=Math.ceil(Math.max(...vals)+1);
  const step=(mx-mn)>10?4:2;mn=Math.floor(mn/step)*step;mx=Math.ceil(mx/step)*step;
  const X=i=>p.l+i*(W-p.l-p.r)/(ys.length-1),Y=v=>p.t+(mx-v)/(mx-mn)*(H-p.t-p.b);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for(let v=mn;v<=mx;v+=step)s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E4E6DE"/><text x="${p.l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  ys.forEach((_,i)=>{if(i%2===0||i===ys.length-1)s+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${t('p_week_l')}${i+1}</text>`});
  if(o.goal)s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${Y(o.goal)}" y2="${Y(o.goal)}" stroke="#C98A1A" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-p.r+4}" y="${Y(o.goal)+4}" style="fill:#B57911">${o.goal}</text>`;
  const pts=ys.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  s+=`<defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1F5A3A" stop-opacity=".16"/><stop offset="1" stop-color="#1F5A3A" stop-opacity="0"/></linearGradient></defs>`;
  s+=`<path d="M${pts.join('L')}L${X(ys.length-1)},${H-p.b}L${p.l},${H-p.b}Z" fill="url(#ga)"/><path d="M${pts.join('L')}" fill="none" stroke="#1F5A3A" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  const li=ys.length-1;s+=`<circle cx="${X(li)}" cy="${Y(ys[li])}" r="5" fill="#1F5A3A" stroke="#fff" stroke-width="2"/><text x="${X(li)}" y="${Y(ys[li])-11}" text-anchor="middle" style="fill:#1D2A21;font-weight:600">${ys[li]}</text>`;
  return s+'</svg>';
}
function series(c){const n=8,out=[];for(let i=0;i<n;i++){const f=i/(n-1);out.push(+(c.start+(c.now-c.start)*f+(i&&i<n-1?Math.sin(i*1.7+c.id)*.35:0)).toFixed(1))}return out}

function calc(){
  const a=+$('#c-age').value||30,w=+$('#c-w').value||70,h=+$('#c-h').value||165,act=+$('#c-act').value;
  const bmr=Math.round(10*w+6.25*h-5*a+(S.sex==='m'?5:-161)),tdee=Math.round(bmr*act);

function openClient(id){
  S.open=id;const c=CLIENTS.find(x=>x.id===id);
  $('#drawerRoot').innerHTML=`<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(L(c.n))}">
   <div class="hd"><div class="cl">${avatar(c)}<div><h3>${esc(L(c.n))}</h3><span class="muted" style="font-size:13px">${goalName(c.goal)} · ${statusPill(c.status)}</span></div></div><button class="btn btn-line btn-sm" id="d-close">${t('close')}</button></div>
   <div class="kv"><div><div class="lab">${t('p_start')}</div><b>${c.start}</b></div><div><div class="lab">${t('p_now')}</div><b>${c.now}</b></div><div><div class="lab">${t('p_goal')}</div><b>${c.target??'—'}</b></div></div>
   <div class="panel" style="padding:12px">${lineChart(c.id===1?USER_W:series(c),{goal:c.target,h:190})}</div>
   <div><h4 style="font-size:20px;margin-bottom:8px">${t('d_latest')} · <span class="muted" style="font-family:var(--f-body);font-size:14px;font-weight:400">${ago(c.last)}</span></h4>
    <div class="kv" style="grid-template-columns:1fr 1fr;margin-bottom:10px"><div><div class="lab">${t('d_water')}</div><b>${c.water}/8</b></div><div style="display:flex;align-items:center;gap:8px"><span style="width:26px;display:block">${face(c.mood)}</span><div><div class="lab">${t('d_mood')}</div><b style="font-size:19px">${t('mood_'+c.mood)}</b></div></div></div>
    <div class="quote">${esc(L(c.note))}</div></div>
   <div><label for="d-notes" style="font-size:14px;font-weight:600;color:var(--ink)">${t('d_notes')}</label><textarea id="d-notes" style="margin-top:6px">${esc(S.notes[id]||'')}</textarea><button class="btn btn-line btn-sm" id="d-save" style="margin-top:6px">${t('d_save')}</button></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-dark btn-sm" id="d-file">${ft('open_file')}</button><button class="btn btn-line btn-sm" id="d-plan">${t('d_send_plan')}</button><a class="btn btn-line btn-sm" target="_blank" rel="noopener" href="${waLink()}">${t('d_wa')}</a></div></aside>`;
  const close=()=>{$('#drawerRoot').innerHTML='';S.open=null;if(c.status==='review'){c.status='active';renderAdmin()}};
  $('#scrim').onclick=close;$('#d-close').onclick=close;$('#d-close').focus();
  document.addEventListener('keydown',function k(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',k)}});
  $('#d-save').onclick=()=>{S.notes[id]=$('#d-notes').value;toast(t('d_saved'))};
  $('#d-plan').onclick=()=>{close();S.aTab='plans';renderAdmin()};
  $('#d-file').onclick=()=>{close();openFileFor(id)};
}

function calcFile(f){const w=+f.w,h=+f.h,a=+f.age,r={};
  if(w&&h)r.bmi=w/((h/100)**2);
  if(w&&h&&a){r.bmr=10*w+6.25*h-5*a+(f.sex==='m'?5:-161);r.tdee=r.bmr*(+f.act);
    r.preg=f.cond.includes('preg')||f.cond.includes('bf');const adj=r.preg?0:{loss:-500,keep:0,gain:300}[f.goal];
    r.sugg=Math.max(f.sex==='m'?1500:1200,Math.round((r.tdee+adj)/50)*50)}
  if(+f.waist&&+f.hip)r.whr=f.waist/f.hip;
  if(w&&+f.tw)r.togo=w-f.tw;
  return r}
const n0=x=>Math.round(x).toLocaleString('en'),n1=x=>(Math.round(x*10)/10).toLocaleString('en');

function resTiles(){const f=S.file,r=calcFile(f);
  if(!r.bmi&&!r.bmr)return `<p class="muted fneed">${ft('need')}</p>`;
  const bc=r.bmi<18.5?['b_under','warn']:r.bmi<25?['b_norm','ok']:r.bmi<30?['b_over','warn']:['b_obese','off'];
  const whrHi=r.whr&&r.whr>=(f.sex==='m'?.9:.85);
  const tile=(lab,val,unit,pill)=>`<div class="ftile"><span class="lab">${lab}</span><b class="num">${val}</b><small>${unit||''}</small>${pill||''}</div>`;
  return `<div class="ftiles">
   ${r.bmi?tile(ft('bmi'),n1(r.bmi),'kg/m²',`<span class="pill ${bc[1]}">${ft(bc[0])}</span>`):''}
   ${r.sugg?tile(ft('sugg'),n0(r.sugg),t('kcal'),r.preg?`<span class="pill warn">${ft('preg_note')}</span>`:''):''}
   ${r.bmr?tile(ft('bmr'),n0(r.bmr),t('kcal')):''}
   ${r.tdee?tile(ft('tdee'),n0(r.tdee),t('kcal')):''}
   ${r.whr?tile(ft('whr'),r.whr.toFixed(2),'',`<span class="pill ${whrHi?'off':'ok'}">${ft(whrHi?'whr_hi':'whr_ok')}</span>`):''}
   ${r.togo!=null?tile(ft('togo'),n1(Math.abs(r.togo)),t('kg')):''}
  </div>`}

function macroBlock(){const f=S.file,k=+f.kcal||0,sum=(+f.p)+(+f.c)+(+f.f);

  return `${row('p',4,'#1F5A3A')}${row('c',4,'#E2B357')}${row('f',9,'#B8C9A8')}<div class="fsum ${sum===100?'':'bad'}" id="fsum">${ft('sum')}: <b class="num">${sum}%</b>${sum===100?'':' · '+ft('sum_bad')}</div>`}
function mealTotal(){const f=S.file,tot=f.meals.reduce((a,m)=>a+(+m.c||0),0),k=+f.kcal||0,p=k?Math.min(100,tot/k*100):0;

function fSummary(forClient){const f=S.file,r=calcFile(f),k=+f.kcal,L1=[];
  if(forClient)L1.push(ft('s_hello',{name:(f.name||'').split(' ')[0]}));else L1.push(`${ft('s_file')}: ${f.name||'—'}`);
  if(!forClient)L1.push(`${ft('s_age')} ${f.age||'—'} · ${ft('s_w')} ${f.w||'—'} ${t('kg')} · ${ft('s_h')} ${f.h||'—'} ${S.lang==='ar'?'سم':'cm'}${r.bmi?' · BMI '+n1(r.bmi):''}`);
  L1.push(`${ft('s_goal')}: ${goalName(mapGoal(f))}${f.tw?` · ${ft('s_tw')} ${f.tw} ${t('kg')}`:''}`);
  if(k)L1.push(`${ft('s_kcal')}: ${n0(k)} (${ft('p')} ${Math.round(k*f.p/400)}${t('g')} · ${ft('c')} ${Math.round(k*f.c/400)}${t('g')} · ${ft('f')} ${Math.round(k*f.f/900)}${t('g')})`);
  const ms=f.meals.filter(m=>m.d.trim());if(ms.length){L1.push('',ft('s_meals')+':');ms.forEach(m=>L1.push(`• ${m.t} ${t(m.k)}: ${m.d}${m.c?` (${m.c} ${t('kcal')})`:''}`))}
  if(f.tips.trim())L1.push('',`${ft('s_tips')}: ${f.tips}`);
  if(f.next)L1.push('',`${ft('s_next')}: ${new Intl.DateTimeFormat(locale(),{weekday:'long',day:'numeric',month:'long'}).format(new Date(f.next))} · ${f.time} (${t(f.type)})`);
  return L1.join('\n')}

function saveFile(){const f=S.file;if(!f.name.trim()){toast(ft('need_name'));S.ftab='assess';renderAdmin();$('#f-name')?.focus();return}
  let c=f.cid!=null?CLIENTS.find(x=>x.id===f.cid):null;
  const log=f.log.slice().sort((a,b)=>a.d<b.d?-1:1),start=log.length?+log[0].w:+f.w,now=+f.w||(log.length?+log.at(-1).w:0);
  if(!c){c={id:Math.max(...CLIENTS.map(x=>x.id))+1,n:[f.name,f.name],goal:'loss',start,now,target:null,last:0,status:'active',water:0,mood:'ok',note:['','']};CLIENTS.push(c);f.cid=c.id}
  Object.assign(c,{n:[f.name,f.name],goal:mapGoal(f),start:start||c.start,now:now||c.now,target:+f.tw||null,water:+f.water||c.water,note:f.hnotes?[f.hnotes,f.hnotes]:c.note});
  S.files[f.cid]=JSON.parse(JSON.stringify(f));store.set('files',S.files);store.set('curFile',f);toast(ft('saved',{name:f.name}));renderAdmin()}

  if(!f){f=blankFile();Object.assign(f,{cid,name:L(c.n),w:String(c.now),tw:c.target?String(c.target):'',hnotes:L(c.note),log:[{d:'2026-09-01',w:c.start},{d:'2026-10-26',w:c.now}],goal:c.goal==='sport'||c.goal==='anemia'?'gain':'loss',
    cond:({dm:['dm2'],pcos:['pcos'],anemia:['anemia'],bp:['bp'],preg:['preg']})[c.goal]||[]})}
  S.file=f;persist();S.aTab='file';S.ftab='assess';renderAdmin();scrollTo(0,0)}

let newArm=0;
function wireFile(M){
  M.querySelectorAll('[data-ftab]').forEach(b=>b.onclick=()=>{S.ftab=b.dataset.ftab;renderAdmin();$('.ftabs')?.scrollIntoView({block:'nearest'})});
  M.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('input',()=>{S.file[el.dataset.k]=el.value;persist();
    if(el.dataset.k==='tpl'){const p=TPLS[+el.value];if(el.value!==''&&p){Object.assign(S.file,{kcal:String(p.k),p:p.m[0],c:p.m[1],f:p.m[2]});persist();renderAdmin();return}}
    if(el.dataset.k==='kcal'){S.file.tpl=''}
    fRefresh()}));
  M.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{S.file[b.dataset.seg]=b.dataset.v;persist();M.querySelectorAll(`[data-seg="${b.dataset.seg}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));
    if(b.dataset.seg==='sex')M.querySelectorAll('[data-lab]').forEach(i=>{const L0=LABS.find(l=>l.k===i.dataset.lab);$('#ls-'+L0.k).innerHTML=labPill(L0,i.value)});fRefresh()});
  M.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{const key=b.dataset.chip,v=b.dataset.v;let arr=S.file[key];
    arr=arr.includes(v)?arr.filter(x=>x!==v):(v==='none'?['none']:[...arr.filter(x=>x!=='none'),v]);S.file[key]=arr;persist();
    M.querySelectorAll(`[data-chip="${key}"]`).forEach(x=>x.setAttribute('aria-pressed',arr.includes(x.dataset.v)));fRefresh()});
  M.querySelectorAll('[data-lab]').forEach(i=>i.addEventListener('input',()=>{const k=i.dataset.lab;S.file.labs[k]=i.value;persist();$('#ls-'+k).innerHTML=labPill(LABS.find(l=>l.k===k),i.value);fProgress()}));
  M.querySelector('.fbody').addEventListener('input',e=>{const el=e.target;
    if(el.dataset.mac){S.file[el.dataset.mac]=+el.value;S.file.tpl='';persist();const k=+S.file.kcal||0,sum=S.file.p+S.file.c+S.file.f;
      $('#mp-'+el.dataset.mac).textContent=el.value;['p','c','f'].forEach(m=>$('#mg-'+m).textContent=(k?Math.round(k*S.file[m]/100/(m==='f'?9:4)):'–')+' '+t('g'));
      const s=$('#fsum');s.className='fsum'+(sum===100?'':' bad');s.innerHTML=`${ft('sum')}: <b class="num">${sum}%</b>${sum===100?'':' · '+ft('sum_bad')}`;const tp=$('#f-tpl');if(tp)tp.value=''}
    if(el.dataset.meal!=null){S.file.meals[+el.dataset.meal][el.dataset.mk]=el.value;persist();$('#ftot').innerHTML=mealTotal();fProgress()}});
  $('#useSugg')?.addEventListener('click',()=>{S.file.kcal=String(calcFile(S.file).sugg);S.file.tpl='';persist();renderAdmin()});
  $('#fillMeals')?.addEventListener('click',()=>{S.file.meals=SLOTS.map((s,i)=>({t:s.t,k:s.k,d:L(MEALS[i].d),c:String(MEALS[i].c)}));persist();renderAdmin()});
  $('#sendPortal')?.addEventListener('click',()=>toast(ft('sent_portal',{name:S.file.name||'—'})));
  $('#lgAdd')?.addEventListener('click',()=>{const d=$('#lg-d').value,w=+$('#lg-w').value;if(!d||!w){$('#lg-w').focus();return}
    S.file.log=S.file.log.filter(x=>x.d!==d).concat({d,w});S.file.w=String(S.file.log.slice().sort((a,b)=>a.d<b.d?-1:1).at(-1).w);persist();renderAdmin()});
  M.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const [d,w]=b.dataset.del.split('|');S.file.log=S.file.log.filter(x=>!(x.d===d&&String(x.w)===w));persist();renderAdmin()});
  $('#fSave').onclick=saveFile;
  $('#fNew').onclick=()=>{const b=$('#fNew span');if(Date.now()-newArm<3000){S.file=blankFile();persist();S.ftab='assess';newArm=0;renderAdmin();toast(ft('cleared'));$('#f-name')?.focus();return}
    newArm=Date.now();b.textContent=ft('newf_sure');setTimeout(()=>{if(b.isConnected)b.textContent=ft('newf')},3000)};
  $('#fCopy').onclick=()=>{const txt=fSummary(false);(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(ft('copied'))).catch(()=>toast(ft('copy_fail')))};
  $('#fWa').onclick=()=>{const d=(S.file.phone||'').replace(/\D/g,'');if(d.length<8){toast(ft('need_phone'));S.ftab='assess';renderAdmin();$('#f-phone')?.focus();return}
    const a=document.createElement('a');a.href='https://wa.me/'+d+'?text='+encodeURIComponent(fSummary(true));a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()};
  fProgress();
}


/* ---------- shell ---------- */
function setView(v){S.view=v;['site','portal','admin'].forEach(x=>$('#view-'+x).hidden=x!==v);$('#appHead').hidden=v==='site';
  $$('.seg [data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===v));
  if(v==='portal')renderPortal();if(v==='admin')renderAdmin();window.scrollTo(0,0);
  try{history.replaceState(null,'',v==='site'?location.pathname:'#'+(v==='admin'?'dashboard':'portal'))}catch(e){}}
function applyLang(){
  document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
  $$('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  $$('.brandName').forEach(el=>el.textContent=L(CONFIG.name));$$('.brandSub').forEach(el=>el.textContent=L(CONFIG.role));
  $$('.steps .n').forEach((el,i)=>el.textContent=S.lang==='ar'?'١٢٣٤'[i]:'0'+(i+1));
  renderSite();if(S.view==='portal')renderPortal();if(S.view==='admin')renderAdmin();if(S.open)openClient(S.open);
}
$$('svg.qm').forEach(s=>s.innerHTML=qamariya());
$$('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
$$('[data-go]').forEach(b=>b.addEventListener('click',()=>document.getElementById(b.dataset.go).scrollIntoView({behavior:'smooth'})));
$$('[data-home]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();setView('site')}));
$$('[data-lang]').forEach(b=>b.onclick=()=>{S.lang=S.lang==='ar'?'en':'ar';store.set('lang',S.lang);applyLang()});
$('#calcForm').addEventListener('submit',e=>e.preventDefault());
['#c-age','#c-w','#c-h','#c-act'].forEach(s=>$(s).addEventListener('input',calc));
[['#c-sex','sex'],['#c-goal','goal']].forEach(([sel,key])=>$(sel).querySelectorAll('button').forEach(b=>b.onclick=()=>{$(sel).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));S[key]=key==='goal'?+b.dataset.v:b.dataset.v;calc()}));
$('#contactForm').addEventListener('submit',e=>{e.preventDefault();
  const type=$('#k-type').value==='inperson'?t('inperson_t'):t('online_t');
  const msg=t('wa_msg',{name:$('#k-name').value.trim()||'—',phone:$('#k-phone').value.trim()||'—',type,msg:$('#k-msg').value.trim()||'—'});
  $('#waText').textContent=msg;$('#waOpen').href=waLink(msg);$('#waOut').hidden=false});
$('#waCopy').onclick=()=>{const txt=$('#waText').textContent;(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(t('copied'))).catch(()=>{const r=document.createRange();r.selectNodeContents($('#waText'));const s=getSelection();s.removeAllRanges();s.addRange(r)})};

applyLang();
setView(location.hash==='#dashboard'?'admin':location.hash==='#portal'?'portal':'site');
/* ---------- motion ---------- */
const RM=matchMedia('(prefers-reduced-motion: reduce)');
function tweenNum(el,from,to){
  if(from===to||!el||RM.matches)return;const node=el.firstChild,t0=performance.now(),D=520;
  (function f(now){const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);node.nodeValue=Math.round(from+(to-from)*e).toLocaleString('en');if(k<1)requestAnimationFrame(f)})(t0);
}
(function motion(){
  const hero=$('.hero'),produce=$('.hero .produce'),w1=$('.lead-block'),w2=$('.word.w2');
  const floaties=[...$$('.floaty')],arch=$('.arch'),archImg=$('.arch img'),steps=$('.steps');
  let mx=0,my=0,cx=0,cy=0;
  hero.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=hero.getBoundingClientRect();mx=(e.clientX-r.left)/r.width*2-1;my=(e.clientY-r.top)/r.height*2-1});
  hero.addEventListener('pointerleave',()=>{mx=0;my=0});
  // reveal: only elements that start below the first screen
  const rvSel='.head-row,.portion,.type,.story,.feat li,.cred,.pillars li,.faq details,.info-item,.cform,.steps li';
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}}),{rootMargin:'0px 0px -8% 0px'});
  const groups=new Map();
  $$(rvSel).forEach(el=>{if(RM.matches)return;if(el.getBoundingClientRect().top<innerHeight)return;
    const g=el.parentElement;const i=groups.get(g)||0;groups.set(g,i+1);el.style.setProperty('--i',Math.min(i,5));el.setAttribute('data-rv','');io.observe(el)});
  // callouts pop when plate is seen
  new IntersectionObserver((es,o)=>es.forEach(en=>{if(en.isIntersecting){arch.classList.add('in');o.disconnect()}}),{threshold:.35}).observe(arch);
  // rows point at the plate
  $$('.portion').forEach(p=>{const on=()=>{arch.classList.add('dim');$('.call.'+p.dataset.call).classList.add('hot')},off=()=>{arch.classList.remove('dim');$$('.call.hot').forEach(c=>c.classList.remove('hot'))};
    p.addEventListener('mouseenter',on);p.addEventListener('mouseleave',off);p.addEventListener('focus',on);p.addEventListener('blur',off)});
  function frame(){
    if(S.view==='site'&&!RM.matches){
      cx+=(mx-cx)*.08;cy+=(my-cy)*.08;const vh=innerHeight,sy=scrollY;
      if(produce)produce.style.translate=`${(-cx*18).toFixed(2)}px ${(-cy*12+sy*.12).toFixed(2)}px`;
      if(w1)w1.style.translate=`${(cx*8).toFixed(2)}px ${(cy*5).toFixed(2)}px`;
      if(w2)w2.style.translate=`${(cx*12).toFixed(2)}px ${(cy*7-sy*.05).toFixed(2)}px`;
      for(const f of floaties){const d=+f.dataset.depth,sec=f.parentElement.closest('section')||f.parentElement,r=sec.getBoundingClientRect();
        if(r.bottom<-200||r.top>vh+200)continue;const off=(r.top+r.height/2-vh/2)*d*.18;const inHero=sec===hero;
        f.style.translate=`${inHero?(-cx*30*d).toFixed(2):0}px ${(off+(inHero?-cy*22*d:0)).toFixed(2)}px`}
      if(archImg){const r=arch.getBoundingClientRect();if(r.bottom>0&&r.top<vh){const p=Math.min(1,Math.max(0,(vh-r.top)/(vh+r.height)));archImg.style.rotate=((p-.5)*60).toFixed(2)+'deg'}}
      if(steps){const r=steps.getBoundingClientRect();const p=Math.min(1,Math.max(0,(vh*.85-r.top)/(vh*.6)));steps.style.setProperty('--p',p.toFixed(3));
        steps.querySelectorAll('li').forEach((li,i)=>li.classList.toggle('lit',p>=(i+.5)/4))}
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
